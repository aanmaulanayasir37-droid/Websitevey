<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Vervey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333333;
            padding: 25px;
            border-radius: 12px;
            background-color: #111111;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #222222;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #444444;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dashboard Utama</h1>
        
        <div class="menu-list">
            <a href="video.html" class="menu-btn">VIDEO</a>
            <a href="cerita.html" class="menu-btn">CERITA</a>
            <a href="informasi.html" class="menu-btn">INFORMASI</a>
        </div>
    </div>

</body>
</html>
