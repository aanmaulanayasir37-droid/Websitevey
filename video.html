<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Video YouTube</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
        }

        /* Style Tombol Kembali Monokrom */
        .btn-kembali {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ffffff;
            background-color: #000000;
            color: #ffffff;
            transition: 0.3s;
        }

        .btn-kembali:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Judul Halaman */
        h1 {
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Container Video Responsif dengan Bingkai Putih Tipis */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            margin-bottom: 25px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Tombol Kembali Hitam Putih -->
    <a href="Coba.html">
        <button class="btn-kembali">Kembali ke Utama</button>
    </a>

    <br>
    <h1>Nonton Video</h1>

    <!-- Video 1 -->
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/YKfLeBqnyqk" allowfullscreen></iframe>
    </div>

    <!-- Video 2 -->

</html>
