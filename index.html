<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0">
    <title>Website Vervey - Baca Buku & Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #000000;
        }
        .hero {
            padding: 10px;
        }
        
        /* Style Tombol Monokrom (Hitam-Putih) */
        .btn-theme {
            padding: 8px 14px;
            margin-right: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ffffff;
            background-color: #000000;
            color: #ffffff;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-theme:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .logo-web {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header class="hero">
        <!-- Tombol Logo Menu -->
        <button id="theme-toggle" class="btn-theme">logo menu</button>
        
        <!-- Tombol Video Menu -->
        <a href="Video.html">
            <button class="btn-theme">video menu</button>
        </a>

        <!-- Tombol Cerita Menu -->
        <a href="Cerita.html">
            <button class="btn-theme">cerita menu</button>
        </a>

        <!-- Tombol Informasi Menu (Baru) -->
        <a href="Informasi.html">
            <button class="btn-theme">informasi menu</button>
        </a>

        <!-- Daftar Gambar Manga -->
        <img src="logo.png" alt="" class="logo-web">
        <img src="logo1.png" alt="" class="logo-web">
        <img src="logo2.png" alt="" class="logo-web">
        <img src="logo3.png" alt="" class="logo-web">
        <img src="logo4.png" alt="" class="logo-web">
        <img src="logo5.png" alt="" class="logo-web">
        <img src="logo6.png" alt="" class="logo-web">
        <img src="logo7.png" alt="" class="logo-web">
        <img src="logo8.png" alt="" class="logo-web">
        <img src="logo9.png" alt="" class="logo-web">
        <img src="logo10.png" alt="" class="logo-web">
        <img src="logo11.png" alt="" class="logo-web">
        <img src="logo12.png" alt="" class="logo-web">
    </header>

</body>
</html>
